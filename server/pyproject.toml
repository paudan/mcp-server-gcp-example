[project]
name = "catalog-mcp"
version = "0.1.0"
description = "Example MCP server for the 'MCP server on GCP' tutorial."
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.24,<2",
    "google-auth>=2.29",
    "pyjwt[crypto]>=2.10.1",
    "requests>=2.32",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-gcp-trace>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "httpx>=0.27",
    "ruff>=0.4.6,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
